name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: web_analysis_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d web_analysis_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      APP_PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/web_analysis_ci?schema=public
      REDIS_URL: redis://localhost:6379
      VITEST_MAX_FORKS: 1
      VITEST_UNIT_MAX_FORKS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations (validate job)
        run: npm run db:migrate:deploy

      - name: Validate OpenAPI contract
        run: npm run openapi:validate

      - name: Validate environment variables
        run: npm run env:validate

      - name: Check hardcoded secrets
        run: npm run secret:check

      - name: Validate Stage 5 docs coherence
        run: npm run docs:stage5:coherence

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=2
          while true; do
            rm -f unit_tests.log
            if npm test | tee unit_tests.log; then
              break
            fi

            if grep -q "Worker exited unexpectedly" unit_tests.log && [ "$attempt" -lt "$max_attempts" ]; then
              echo "Se detecto error intermitente de worker. Reintentando Unit tests (intento $((attempt + 1))/${max_attempts})..."
              attempt=$((attempt + 1))
              continue
            fi

            echo "Unit tests fallo de forma no recuperable."
            exit 1
          done

      - name: Upload unit tests log on failure
        if: ${{ failure() && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-log
          path: unit_tests.log
          if-no-files-found: ignore

      - name: Integration tests
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=2
          while true; do
            rm -f integration_tests.log
            if npm run test:integration | tee integration_tests.log; then
              break
            fi

            if grep -q "Worker exited unexpectedly" integration_tests.log && [ "$attempt" -lt "$max_attempts" ]; then
              echo "Se detecto error intermitente de worker. Reintentando Integration tests (intento $((attempt + 1))/${max_attempts})..."
              attempt=$((attempt + 1))
              continue
            fi

            echo "Integration tests fallo de forma no recuperable."
            exit 1
          done

      - name: Upload integration tests log on failure
        if: ${{ failure() && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-log
          path: integration_tests.log
          if-no-files-found: ignore

      - name: Laboratory gate E4-B1
        run: npm run lab:e4b1:gate

      - name: Report Stage 5.1 gate coverage
        run: |
          echo "E5.1 gate integration coverage: 6 files / 11 tests expected"
          echo "- tests/integration/stage5-scope-gate.integration.test.ts"
          echo "- tests/integration/stage5-passive-fetch.integration.test.ts"
          echo "- tests/integration/stage5-e2e-lab.integration.test.ts"
          echo "- tests/integration/stage5-evidence-recovery.integration.test.ts"
          echo "- tests/integration/stage5-operational-query.integration.test.ts"
          echo "- tests/integration/stage5-fetch-errors.integration.test.ts"

      - name: Stage 5.1 gate E5-1
        shell: bash
        run: |
          set -euo pipefail
          npm run lab:e5-1:gate | tee e5_1_gate.log

      - name: Report Stage 5.1 gate result
        shell: bash
        run: |
          set -euo pipefail
          files_passed="$(sed -nE 's/^[[:space:]]*Test Files[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\1/p' e5_1_gate.log | tail -n1)"
          files_total="$(sed -nE 's/^[[:space:]]*Test Files[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\2/p' e5_1_gate.log | tail -n1)"
          tests_passed="$(sed -nE 's/^[[:space:]]*Tests[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\1/p' e5_1_gate.log | tail -n1)"
          tests_total="$(sed -nE 's/^[[:space:]]*Tests[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\2/p' e5_1_gate.log | tail -n1)"

          if [ -z "$files_passed" ] || [ -z "$files_total" ] || [ -z "$tests_passed" ] || [ -z "$tests_total" ]; then
            echo "No se pudieron extraer los resultados reales del gate E5.1 desde e5_1_gate.log"
            exit 1
          fi

          if [ "$files_passed" != "6" ] || [ "$files_total" != "6" ]; then
            echo "Cobertura inesperada de archivos de integracion para E5.1: ${files_passed}/${files_total}. Se esperaba 6/6."
            exit 1
          fi

          if [ "$tests_passed" != "11" ] || [ "$tests_total" != "11" ]; then
            echo "Cobertura inesperada de tests de integracion para E5.1: ${tests_passed}/${tests_total}. Se esperaba 11/11."
            exit 1
          fi

          echo "E5.1 gate result: integration_files_passed=${files_passed}/${files_total}; integration_tests_passed=${tests_passed}/${tests_total}"

      - name: Report Stage 5.2 gate coverage
        run: |
          echo "E5.2 gate integration coverage: 10 files / 23 tests expected"
          echo "- tests/integration/stage5-scope-gate.integration.test.ts"
          echo "- tests/integration/stage5-passive-fetch.integration.test.ts"
          echo "- tests/integration/stage5-e2e-lab.integration.test.ts"
          echo "- tests/integration/stage5-e2e-lab-extended.integration.test.ts"
          echo "- tests/integration/stage5-e2e-lab-failure-matrix.integration.test.ts"
          echo "- tests/integration/stage5-evidence-recovery.integration.test.ts"
          echo "- tests/integration/stage5-operational-query.integration.test.ts"
          echo "- tests/integration/stage5-fetch-errors.integration.test.ts"
          echo "- tests/integration/stage5-result-recovery.integration.test.ts"
          echo "- tests/integration/stage5-observability.integration.test.ts"

      - name: Stage 5.2 gate E5-2
        shell: bash
        run: |
          set -euo pipefail
          # Estabilidad runner Stage 5: ver ADR-007 para decision --pool=forks y rollback.
          attempt=1
          max_attempts=2
          while true; do
            rm -f e5_2_gate.log
            if npm run lab:e5-2:gate | tee e5_2_gate.log; then
              break
            fi

            if grep -q "Worker exited unexpectedly" e5_2_gate.log && [ "$attempt" -lt "$max_attempts" ]; then
              echo "Se detecto error intermitente de worker. Reintentando gate E5.2 (intento $((attempt + 1))/${max_attempts})..."
              attempt=$((attempt + 1))
              continue
            fi

            echo "Gate E5.2 fallo de forma no recuperable."
            exit 1
          done

      - name: Report Stage 5.2 gate result
        shell: bash
        run: |
          set -euo pipefail
          files_passed="$(sed -nE 's/^[[:space:]]*Test Files[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\1/p' e5_2_gate.log | tail -n1)"
          files_total="$(sed -nE 's/^[[:space:]]*Test Files[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\2/p' e5_2_gate.log | tail -n1)"
          tests_passed="$(sed -nE 's/^[[:space:]]*Tests[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\1/p' e5_2_gate.log | tail -n1)"
          tests_total="$(sed -nE 's/^[[:space:]]*Tests[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\2/p' e5_2_gate.log | tail -n1)"

          if [ -z "$files_passed" ] || [ -z "$files_total" ] || [ -z "$tests_passed" ] || [ -z "$tests_total" ]; then
            echo "No se pudieron extraer los resultados reales del gate E5.2 desde e5_2_gate.log"
            exit 1
          fi

          if [ "$files_passed" != "10" ] || [ "$files_total" != "10" ]; then
            echo "Cobertura inesperada de archivos de integracion para E5.2: ${files_passed}/${files_total}. Se esperaba 10/10."
            exit 1
          fi

          if [ "$tests_passed" != "23" ] || [ "$tests_total" != "23" ]; then
            echo "Cobertura inesperada de tests de integracion para E5.2: ${tests_passed}/${tests_total}. Se esperaba 23/23."
            exit 1
          fi

          echo "E5.2 gate result: integration_files_passed=${files_passed}/${files_total}; integration_tests_passed=${tests_passed}/${tests_total}"

      - name: Report Stage 5.3 gate coverage
        run: |
          echo "E5.3 gate coverage: Stage 5.2 gate (10 files / 23 tests) + observability regression (1 file / 3 tests)"
          echo "- Stage 5.2 gate: npm run lab:e5-2:gate"
          echo "- Observability regression: npm run lab:e5-3:obs-regression"

      - name: Restore Stage 5 gate timing history
        id: restore-stage5-timing-history
        uses: actions/cache/restore@v4
        with:
          path: .ci/timing-history
          key: stage5-gate-timing-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stage5-gate-timing-history-${{ github.ref_name }}-
            stage5-gate-timing-history-

      - name: Stage 5.3 gate E5-3
        shell: bash
        run: |
          set -euo pipefail
          gate_start_epoch="$(date +%s)"
          attempt=1
          max_attempts=2
          while true; do
            rm -f e5_3_gate.log
            if npm run lab:e5-3:gate | tee e5_3_gate.log; then
              break
            fi

            if grep -q "Worker exited unexpectedly" e5_3_gate.log && [ "$attempt" -lt "$max_attempts" ]; then
              echo "Se detecto error intermitente de worker. Reintentando gate E5.3 (intento $((attempt + 1))/${max_attempts})..."
              attempt=$((attempt + 1))
              continue
            fi

            echo "Gate E5.3 fallo de forma no recuperable."
            exit 1
          done

          gate_end_epoch="$(date +%s)"
          gate_duration_seconds="$((gate_end_epoch - gate_start_epoch))"
          echo "E5_3_GATE_DURATION_SECONDS=${gate_duration_seconds}" >> "$GITHUB_ENV"
          echo "duration_seconds=${gate_duration_seconds}" > e5_3_gate_timing.log

      - name: Report Stage 5.3 gate result
        shell: bash
        run: |
          set -euo pipefail
          file_pairs="$(sed -nE 's/^[[:space:]]*Test Files[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\1\/\2/p' e5_3_gate.log)"
          test_pairs="$(sed -nE 's/^[[:space:]]*Tests[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\1\/\2/p' e5_3_gate.log)"

          if [ -z "$file_pairs" ] || [ -z "$test_pairs" ]; then
            echo "No se pudieron extraer resultados de integracion del gate E5.3 desde e5_3_gate.log"
            exit 1
          fi

          if ! echo "$file_pairs" | grep -q '^10/10$'; then
            echo "Falta resultado esperado de Stage 5.2 en archivos de integracion (10/10)."
            exit 1
          fi

          if ! echo "$test_pairs" | grep -q '^23/23$'; then
            echo "Falta resultado esperado de Stage 5.2 en tests de integracion (23/23)."
            exit 1
          fi

          if ! echo "$file_pairs" | grep -q '^1/1$'; then
            echo "Falta resultado esperado de regression de observabilidad en archivos (1/1)."
            exit 1
          fi

          if ! echo "$test_pairs" | grep -q '^3/3$'; then
            echo "Falta resultado esperado de regression de observabilidad en tests (3/3)."
            exit 1
          fi

          echo "E5.3 gate result: stage5_gate_files=10/10; stage5_gate_tests=23/23; obs_regression_files=1/1; obs_regression_tests=3/3"
          echo "E5.3 gate duration: ${E5_3_GATE_DURATION_SECONDS}s"

      - name: Report Stage 5.3 gate timing trend
        shell: bash
        run: |
          set -euo pipefail
          duration_seconds="${E5_3_GATE_DURATION_SECONDS:-}"
          warning_threshold_seconds=480
          history_dir=".ci/timing-history"
          history_file="${history_dir}/e5_3_gate_history.log"
          trend_file="e5_3_gate_timing_history.log"

          if [ -z "$duration_seconds" ]; then
            echo "No se pudo leer E5_3_GATE_DURATION_SECONDS para reporte de tendencia."
            exit 1
          fi

          if ! [[ "$duration_seconds" =~ ^[0-9]+$ ]]; then
            echo "Valor invalido para E5_3_GATE_DURATION_SECONDS: ${duration_seconds}"
            exit 1
          fi

          mkdir -p "$history_dir"
          touch "$history_file"

          previous_duration_seconds="$(awk -F',' 'NF >= 3 { last = $3 } END { if (last != "") print last; else print "na" }' "$history_file")"

          if [[ "$previous_duration_seconds" =~ ^[0-9]+$ ]]; then
            delta_seconds="$((duration_seconds - previous_duration_seconds))"
          else
            delta_seconds="na"
          fi

          printf "%s,%s,%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${GITHUB_RUN_ID:-na}" "$duration_seconds" >> "$history_file"

          {
            echo "history_file=${history_file}"
            echo "duration_seconds=${duration_seconds}"
            echo "previous_duration_seconds=${previous_duration_seconds}"
            echo "delta_seconds=${delta_seconds}"
            echo "threshold_seconds=${warning_threshold_seconds}"
          } > "$trend_file"

          echo "E5_3_GATE_PREVIOUS_DURATION_SECONDS=${previous_duration_seconds}" >> "$GITHUB_ENV"
          echo "E5_3_GATE_DELTA_SECONDS=${delta_seconds}" >> "$GITHUB_ENV"

          if [ "$duration_seconds" -gt "$warning_threshold_seconds" ]; then
            echo "::warning::E5.3 gate timing trend: ${duration_seconds}s (umbral operativo ${warning_threshold_seconds}s). Revisar cambios recientes en suites, runner y fixtures."
            echo "E5.3 gate timing trend: status=warning; duration_seconds=${duration_seconds}; previous_duration_seconds=${previous_duration_seconds}; delta_seconds=${delta_seconds}; threshold_seconds=${warning_threshold_seconds}"
          else
            echo "E5.3 gate timing trend: status=ok; duration_seconds=${duration_seconds}; previous_duration_seconds=${previous_duration_seconds}; delta_seconds=${delta_seconds}; threshold_seconds=${warning_threshold_seconds}"
          fi

      - name: Save Stage 5 gate timing history cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: .ci/timing-history
          key: stage5-gate-timing-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload Stage 5 gate timing history artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage5-gate-timing-history
          path: |
            .ci/timing-history/e5_3_gate_history.log
            e5_3_gate_timing_history.log
          if-no-files-found: ignore

      - name: Report Stage 5.4 gate coverage
        run: |
          echo "E5.4 gate coverage: Stage 5.3 gate + Stage 5 docs coherence"
          echo "- Stage 5.3 gate: npm run lab:e5-3:gate"
          echo "- Stage 5 docs coherence: npm run docs:stage5:coherence"

      - name: Stage 5.4 gate E5-4
        shell: bash
        run: |
          set -euo pipefail
          npm run lab:e5-4:gate | tee e5_4_gate.log

      - name: Report Stage 5.4 gate result
        shell: bash
        run: |
          set -euo pipefail
          file_pairs="$(sed -nE 's/^[[:space:]]*Test Files[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\1\/\2/p' e5_4_gate.log)"
          test_pairs="$(sed -nE 's/^[[:space:]]*Tests[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\1\/\2/p' e5_4_gate.log)"

          if [ -z "$file_pairs" ] || [ -z "$test_pairs" ]; then
            echo "No se pudieron extraer resultados de integracion del gate E5.4 desde e5_4_gate.log"
            exit 1
          fi

          if ! echo "$file_pairs" | grep -q '^10/10$'; then
            echo "Falta resultado esperado de Stage 5.2 en archivos de integracion (10/10)."
            exit 1
          fi

          if ! echo "$test_pairs" | grep -q '^23/23$'; then
            echo "Falta resultado esperado de Stage 5.2 en tests de integracion (23/23)."
            exit 1
          fi

          if ! echo "$file_pairs" | grep -q '^1/1$'; then
            echo "Falta resultado esperado de regression de observabilidad en archivos (1/1)."
            exit 1
          fi

          if ! echo "$test_pairs" | grep -q '^3/3$'; then
            echo "Falta resultado esperado de regression de observabilidad en tests (3/3)."
            exit 1
          fi

          if ! grep -Fq "[docs:stage5:coherence] OK" e5_4_gate.log; then
            echo "No se detecto confirmacion de coherencia documental Stage 5 en gate E5.4."
            exit 1
          fi

          duration_seconds="${E5_3_GATE_DURATION_SECONDS:-na}"
          previous_duration_seconds="${E5_3_GATE_PREVIOUS_DURATION_SECONDS:-na}"
          delta_seconds="${E5_3_GATE_DELTA_SECONDS:-na}"
          echo "E5.4 gate result: stage5_gate_files=10/10; stage5_gate_tests=23/23; obs_regression_files=1/1; obs_regression_tests=3/3; docs_stage5_coherence=ok; last_stage5_3_gate_duration_seconds=${duration_seconds}; previous_stage5_3_gate_duration_seconds=${previous_duration_seconds}; stage5_3_gate_delta_seconds=${delta_seconds}"

      - name: Report Stage 6 gate coverage
        run: |
          echo "E6 gate coverage: OpenAPI + Typecheck + Stage 6 dynamic observation integration suite"
          echo "- OpenAPI: npm run openapi:validate"
          echo "- Typecheck: npm run typecheck"
          echo "- Integration suite: tests/integration/stage6-dynamic-observation.integration.test.ts"

      - name: Stage 6 gate E6
        shell: bash
        run: |
          set -euo pipefail
          npm run lab:e6:gate | tee e6_gate.log

      - name: Report Stage 6 gate result
        shell: bash
        run: |
          set -euo pipefail
          files_passed="$(sed -nE 's/^[[:space:]]*Test Files[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\1/p' e6_gate.log | tail -n1)"
          files_total="$(sed -nE 's/^[[:space:]]*Test Files[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\2/p' e6_gate.log | tail -n1)"
          tests_passed="$(sed -nE 's/^[[:space:]]*Tests[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\1/p' e6_gate.log | tail -n1)"
          tests_total="$(sed -nE 's/^[[:space:]]*Tests[[:space:]]+([0-9]+)[[:space:]]+passed[[:space:]]+\(([0-9]+)\).*/\2/p' e6_gate.log | tail -n1)"

          if [ -z "$files_passed" ] || [ -z "$files_total" ] || [ -z "$tests_passed" ] || [ -z "$tests_total" ]; then
            echo "No se pudieron extraer resultados del gate E6 desde e6_gate.log"
            exit 1
          fi

          if [ "$files_passed" != "1" ] || [ "$files_total" != "1" ]; then
            echo "Cobertura inesperada de archivos para gate E6: ${files_passed}/${files_total}. Se esperaba 1/1."
            exit 1
          fi

          if [ "$tests_passed" != "4" ] || [ "$tests_total" != "4" ]; then
            echo "Cobertura inesperada de tests para gate E6: ${tests_passed}/${tests_total}. Se esperaba 4/4."
            exit 1
          fi

          echo "E6 gate result: integration_files_passed=${files_passed}/${files_total}; integration_tests_passed=${tests_passed}/${tests_total}; openapi=ok; typecheck=ok"

      - name: Build
        run: npm run build

  db-migration:
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: web_analysis_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d web_analysis_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/web_analysis_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy
