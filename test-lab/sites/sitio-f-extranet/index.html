<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sitio F - Extranet</title>
    <style>
      body { font-family: Segoe UI, sans-serif; margin: 2rem; }
      .panel { border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; max-width: 760px; }
      .row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
      label { display: block; margin-top: 0.5rem; }
      pre { background: #f6f8fa; padding: 0.75rem; border-radius: 6px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Sitio F - Extranet</h1>
    <p>Flujo sintetico con roles cliente y supervisor.</p>

    <form id="login-form" class="panel">
      <label>Usuario <input id="username" type="text" name="username" required /></label>
      <label>Clave <input id="password" type="password" name="password" required /></label>
      <label>Rol
        <select id="role" name="role">
          <option value="cliente">Cliente</option>
          <option value="supervisor">Supervisor</option>
        </select>
      </label>
      <div class="row">
        <button type="submit">Ingresar</button>
        <button id="logout" type="button">Cerrar sesion</button>
      </div>
    </form>

    <section id="client-flow" class="panel">
      <h2>Flujo cliente</h2>
      <p>Visualiza datos propios sinteticos.</p>
    </section>

    <section id="supervisor-flow" class="panel">
      <h2>Flujo supervisor</h2>
      <p>Visualiza panel agregado sintetico.</p>
    </section>

    <section class="panel">
      <h2>Estado de sesion</h2>
      <pre id="session-state">Cargando...</pre>
      <h2>Perfil activo</h2>
      <pre id="profile-state">Sin autenticar.</pre>
    </section>

    <script>
      const clientId = "sitio-f-ui";

      async function refreshSession() {
        const response = await fetch(`/sitio-f/session/status?clientId=${clientId}`);
        const data = await response.json();
        document.getElementById("session-state").textContent = JSON.stringify(data.session, null, 2);
      }

      async function refreshProfile() {
        const response = await fetch(`/sitio-f/profile?clientId=${clientId}`);
        if (!response.ok) {
          document.getElementById("profile-state").textContent = "Sin autenticar.";
          return;
        }
        const data = await response.json();
        document.getElementById("profile-state").textContent = JSON.stringify(data.profile, null, 2);
      }

      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value;

        await fetch(`/sitio-f/auth/login?clientId=${clientId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, role })
        });

        await refreshSession();
        await refreshProfile();
      });

      document.getElementById("logout").addEventListener("click", async () => {
        await fetch(`/sitio-f/auth/logout?clientId=${clientId}`, {
          method: "POST"
        });

        await refreshSession();
        await refreshProfile();
      });

      refreshSession().then(refreshProfile);
    </script>
  </body>
</html>
