<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sitio D - SPA dinamica</title>
    <style>
      body { font-family: Segoe UI, sans-serif; margin: 2rem; }
      .panel { border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; max-width: 760px; }
      .row { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
      pre { background: #f6f8fa; padding: 0.75rem; border-radius: 6px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Sitio D - SPA dinamica</h1>
    <p id="status">Render inicial estatico.</p>
    <div id="app"></div>
    <div class="panel">
      <div class="row">
        <button id="go-registro">Navegar a /registro</button>
        <button id="go-resumen">Navegar a /resumen</button>
      </div>
      <p>Estado SPA server-side:</p>
      <pre id="spa-state">Cargando...</pre>
      <p>API JSON local:</p>
      <pre id="spa-api">Cargando...</pre>
    </div>

    <script>
      const clientId = "sitio-d-ui";

      async function refreshState() {
        const response = await fetch(`/sitio-d/spa/state?clientId=${clientId}`);
        const data = await response.json();
        document.getElementById("spa-state").textContent = JSON.stringify(data.spa, null, 2);
      }

      async function refreshApi() {
        const response = await fetch(`/sitio-d/api/profile?clientId=${clientId}`);
        const data = await response.json();
        document.getElementById("spa-api").textContent = JSON.stringify(data, null, 2);
      }

      async function bootstrapSpa() {
        await fetch(`/sitio-d/spa/bootstrap?clientId=${clientId}`, { method: "POST" });
      }

      async function navigate(route) {
        await fetch(`/sitio-d/spa/navigate?clientId=${clientId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ route })
        });
        await refreshState();
        await refreshApi();
      }

      document.getElementById("go-registro").addEventListener("click", async () => navigate("/registro"));
      document.getElementById("go-resumen").addEventListener("click", async () => navigate("/resumen"));

      localStorage.setItem("synthetic_spa_boot", "true");
      const mount = document.getElementById("app");
      mount.innerHTML = [
        "<form id='dynamic-form'>",
        "<label>Correo<input type='email' name='email' required></label>",
        "<label>Identificador<input type='text' name='sessionId'></label>",
        "<button type='submit'>Guardar</button>",
        "</form>"
      ].join("");
      document.getElementById("status").textContent = "Render dinamico cliente OK.";

      bootstrapSpa().then(async () => {
        await refreshState();
        await refreshApi();
      });
    </script>
  </body>
</html>
